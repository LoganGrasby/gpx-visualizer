<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPX Visualizer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>GPX File Visualizer</h1>
            <p>Upload and visualize your GPX track files on an interactive map</p>
        </header>
        
        <div class="upload-section">
            <div class="file-input-wrapper">
                <input type="file" id="gpxFile" accept=".gpx" />
                <label for="gpxFile" class="file-input-label">
                    <span>Choose GPX File</span>
                </label>
            </div>
            <button id="sampleBtn">Load Sample (Yushan)</button>
        </div>
        
        <div class="view-toggle">
            <button id="mapViewBtn" class="view-btn active">Map View</button>
            <button id="map3dViewBtn" class="view-btn">3D View</button>
        </div>
        
        <div id="map"></div>
        <div id="map3d" class="hidden"></div>
        
        <div class="info-panel">
            <div class="track-info">
                <h3>Track Information</h3>
                <div id="trackDetails">
                    <p>No track loaded</p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/togeojson@0.5.4/togeojson.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>
    <script src="app.js"></script>
</body>
</html>
